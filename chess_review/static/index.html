<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess Review</title>
<style>
:root {
  --bg: #262421; --panel: #302e2b; --panel2: #3a3733; --line: #45423d; --text: #e6e3de; --muted: #9a958d;
  --light: #ecdab9; --dark: #ae8a68; --hl: rgba(255, 255, 51, .45); --accent: #81b64c;
  --c-brilliant: #1baca6; --c-great: #5c8bb0; --c-best: #81b64c; --c-excellent: #96bc4b; --c-good: #96af8b;
  --c-book: #a88865; --c-forced: #97af8b; --c-inaccuracy: #f7c631; --c-mistake: #ffa459; --c-miss: #ff7769; --c-blunder: #fa412d;
  --win: #81b64c; --loss: #fa412d; --draw: #9a958d;
}
* { box-sizing: border-box; }
/* no double-tap zoom on anything tappable (nav buttons, moves, board); pinch-zoom and scrolling still work */
html, button, a, svg.board, .movelist, .moments, .summary, .nav, .actions, .filters, table.games { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
button, .nav, .m, .moment, .varrow .v, .summary .click { user-select: none; -webkit-user-select: none; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
button:hover { background: #46423d; } button:disabled { opacity: .5; cursor: default; }
button.active { background: var(--accent); color: #1b1b1b; border-color: var(--accent); }
button.primary { background: var(--accent); color: #1b1b1b; border-color: var(--accent); font-weight: 700; }
button.primary:hover { background: #8fc55a; }
header { display: flex; align-items: center; gap: 16px; padding: 10px 18px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
header h1 { font-size: 18px; margin: 0; }
header .crumb { color: var(--muted); }
header .right { margin-left: auto; display: flex; gap: 10px; align-items: center; }
header .right a { color: var(--muted); }
main { padding: 16px 18px; max-width: 1800px; margin: 0 auto; }
.hidden { display: none !important; }
#toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--line); padding: 8px 14px; border-radius: 8px; z-index: 10; }

/* game list */
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
.filters .sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
.filters .stat { color: var(--muted); margin-left: auto; }
table.games { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 8px; overflow: hidden; }
table.games th, table.games td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.games th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
table.games tr.row { cursor: pointer; }
table.games tr.row:hover { background: var(--panel2); }
.dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; border: 1px solid #777; vertical-align: -1px; margin-right: 6px; }
.dot.white { background: #f0f0f0; } .dot.black { background: #222; }
.res { display: inline-block; min-width: 22px; text-align: center; padding: 1px 6px; border-radius: 4px; font-weight: 600; font-size: 12px; color: #1b1b1b; }
.res.win { background: var(--win); } .res.loss { background: var(--loss); color: #fff; } .res.draw { background: var(--draw); }
.acc { font-variant-numeric: tabular-nums; }
.opening { color: var(--muted); max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
.blunders { color: var(--c-blunder); font-weight: 600; }
.pill { font-size: 11px; padding: 1px 7px; border-radius: 10px; background: var(--panel2); color: var(--muted); }
.pill.full { background: #3f5a2a; color: #cde6b3; } .pill.part { background: #5a4a2a; color: #e6d3b3; }

/* review layout */
.review { display: grid; grid-template-columns: 30px minmax(320px, min(900px, calc(100vh - 192px))) minmax(400px, 540px); gap: 14px; align-items: start; justify-content: center; }
/* phones and small tablets: board on top, panel below, nav pinned to the bottom edge */
@media (max-width: 900px) {
  header { padding: 8px 10px; gap: 8px; }
  header h1 { font-size: 16px; }
  header .crumb { display: none; }
  header .right { gap: 6px; }
  header .right button { padding: 5px 8px; font-size: 14px; }
  header .t, header #jobstat { display: none; }
  header h1 { white-space: nowrap; }
  .evalbar .lbl { display: none; }
  main { padding: 8px 8px 84px; }
  .review { grid-template-columns: 14px 1fr; gap: 8px; }
  .review .panel { grid-column: 1 / -1; height: auto; min-height: 0; }
  .evalbar { margin-top: 42px; }
  .player { height: 34px; font-size: 14px; gap: 6px; }
  .player .acc { display: none; }
  .cap svg { width: 13px; height: 13px; }
  .panel .body { max-height: 46vh; }
  .panel .nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); z-index: 6; }
  .panel .nav button { min-width: 0; font-size: 22px; padding: 8px 4px; }
  .coach { padding: 8px 8px 4px; }
  .coach .avatar { display: none; }
  .bubble::before { display: none; }
  .actions { padding: 4px 8px 8px; }
  .actions button { padding: 8px 4px; }
  .pfoot { flex-wrap: wrap; }
  .filters { gap: 6px; }
  .filters button { padding: 5px 8px; font-size: 13px; }
  .filters .stat { width: 100%; margin: 0; font-size: 12px; }
  table.games th, table.games td { padding: 7px 6px; font-size: 13px; }
  table.games th:nth-child(5), table.games td:nth-child(5),
  table.games th:nth-child(8), table.games td:nth-child(8),
  table.games th:nth-child(9), table.games td:nth-child(9),
  table.games th:nth-child(10), table.games td:nth-child(10) { display: none; }
  .opening { max-width: none; }
}
.evalbar { position: relative; height: 640px; background: #403d39; border-radius: 4px; overflow: hidden; align-self: start; margin-top: 46px; }
.evalbar .w { position: absolute; left: 0; right: 0; bottom: 0; background: #f0f0f0; transition: height .25s; }
.evalbar.flipped .w { bottom: auto; top: 0; }
.evalbar .lbl { position: absolute; left: 0; right: 0; text-align: center; font-size: 10px; font-weight: 700; }
.evalbar .lbl.top { top: 4px; color: #ddd; } .evalbar .lbl.bot { bottom: 4px; color: #1b1b1b; }
.boardwrap { display: flex; flex-direction: column; gap: 8px; }
.player { display: flex; align-items: center; gap: 10px; padding: 4px 2px; height: 38px; }
.player .name { font-weight: 600; } .player .rating { color: var(--muted); }
.player .clock { margin-left: auto; font-variant-numeric: tabular-nums; background: var(--panel2); padding: 3px 10px; border-radius: 4px; min-width: 64px; text-align: center; }
.player .clock.low { color: var(--c-blunder); }
.player .acc { background: var(--panel2); padding: 3px 8px; border-radius: 4px; font-size: 12px; }
svg.board { width: 100%; aspect-ratio: 1; display: block; border-radius: 4px; user-select: none; }
.sq.light { fill: var(--light); } .sq.dark { fill: var(--dark); }
.sq.last { fill: var(--hl); }
.coord { font-size: 2.6px; font-weight: 700; pointer-events: none; }
.coord.onlight { fill: var(--dark); } .coord.ondark { fill: var(--light); }
.arrow { opacity: .85; }
svg.board use.piece { transition: transform .18s ease-out; }
svg.board { overflow: visible; }
svg.board use.badge { filter: drop-shadow(0 .4px .7px rgba(0,0,0,.55)); }
.nav { display: flex; gap: 6px; justify-content: center; align-items: center; }
.nav button { min-width: 44px; font-size: 16px; }
#b-prev, #b-next { font-size: 24px; line-height: 1; padding-top: 2px; padding-bottom: 6px; }
#b-play.playing { background: var(--accent); color: #1b1b1b; border-color: var(--accent); }
.nav button:disabled { opacity: .35; }
.sq.sel { fill: rgba(255, 255, 51, .55); }
.target { fill: rgba(235, 235, 235, .55); pointer-events: none; }
.target.ring { fill: none; stroke: rgba(235, 235, 235, .6); stroke-width: 1.1; }
svg.board.playable use.piece.own { cursor: grab; }
.varrow { grid-column: 1 / -1; background: #2b2926; padding: 4px 8px 4px 16px; font-size: 13px; border-left: 3px solid var(--c-great); display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center; }
.varrow .v { cursor: pointer; padding: 1px 4px; border-radius: 3px; display: inline-flex; gap: 4px; align-items: center; }
.varrow .v:hover { background: var(--panel2); } .varrow .v.cur { background: #4b4844; }
.varrow .x { margin-left: auto; color: var(--muted); cursor: pointer; }
.now .var { font-size: 11px; color: var(--c-great); border: 1px solid var(--c-great); border-radius: 3px; padding: 0 5px; }
.summary .l.click, .summary .r.click { cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
.summary .l.click:hover, .summary .r.click:hover { color: var(--accent); }
.hint { text-align: center; color: var(--muted); font-size: 12px; }
.progress { height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden; }
.progress > div { height: 100%; background: var(--accent); transition: width .3s; }

/* side panel */
.panel { background: var(--panel); border-radius: 8px; display: flex; flex-direction: column; height: calc(100vh - 100px); min-height: 560px; }
.phead { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.phead .ptitle { flex: 1; text-align: center; font-weight: 700; font-size: 16px; }
.phead .pright { display: flex; gap: 4px; }
.ginfo { text-align: center; color: var(--muted); font-size: 12px; padding: 4px 10px 0; }
.pbtn { background: transparent; border: 0; color: var(--muted); font-size: 18px; padding: 4px 8px; border-radius: 6px; cursor: pointer; }
.pbtn:hover { background: var(--panel2); color: var(--text); }
.coach { display: flex; gap: 10px; padding: 12px 12px 6px; align-items: flex-start; }
.coach .avatar { width: 44px; height: 44px; border-radius: 8px; background: var(--panel2); display: flex; align-items: center; justify-content: center; font-size: 28px; flex-shrink: 0; }
.bubble { flex: 1; background: #fff; color: #1b1b1b; border-radius: 10px; padding: 10px 12px; position: relative; min-height: 44px; }
.bubble::before { content: ""; position: absolute; left: -8px; top: 16px; border: 8px solid transparent; border-right-color: #fff; border-left: 0; }
.bubble .top { display: flex; align-items: center; gap: 8px; }
.bubble .verdict { flex: 1; font-weight: 600; }
.bubble .evbox { background: #ececec; border-radius: 4px; padding: 2px 8px; font-weight: 700; font-variant-numeric: tabular-nums; }
.bubble p { margin: 6px 0 0; font-size: 13px; color: #333; }
.bubble .var { font-size: 11px; color: var(--c-great); border: 1px solid var(--c-great); border-radius: 3px; padding: 0 5px; }
.bubble .unanalysed { color: #777; }
.actions { display: flex; gap: 8px; padding: 6px 12px 10px; }
.actions button { flex: 1; padding: 9px 6px; font-weight: 600; background: var(--panel2); }
.actions button.active { background: var(--accent); color: #1b1b1b; }
.sections details { border-top: 1px solid var(--line); }
.sections summary { padding: 10px 14px; cursor: pointer; font-weight: 600; list-style: none; display: flex; align-items: center; }
.sections summary::after { content: "▾"; margin-left: auto; color: var(--muted); }
.sections details:not([open]) summary::after { content: "▸"; }
.sections summary::-webkit-details-marker { display: none; }
.opening-info { padding: 4px 14px 12px; color: var(--muted); }
.pfoot { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-top: 1px solid var(--line); }
.pfoot #astatus { flex: 1; color: var(--muted); font-size: 12px; }
.panel .nav { padding: 8px 10px 4px; }
.panel .nav button { flex: 1; }
.cap { display: inline-flex; align-items: center; gap: 0; margin-left: 4px; }
.cap svg { width: 16px; height: 16px; margin-right: -5px; }
.cap svg.blk { filter: drop-shadow(0 0 .6px #d8d8d8) drop-shadow(0 0 .6px #d8d8d8); }
.cap .diff { margin-left: 8px; color: var(--muted); font-size: 12px; }
.panel .head { padding: 12px 14px; border-bottom: 1px solid var(--line); }
.panel .head .title { font-weight: 700; font-size: 15px; }
.panel .head .sub { color: var(--muted); font-size: 12px; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; border: 0; border-radius: 0; background: transparent; padding: 10px; color: var(--muted); border-bottom: 2px solid transparent; }
.tabs button.active { background: transparent; color: var(--text); border-bottom-color: var(--accent); }
.panel .body { overflow: auto; flex: 1; position: relative; }
.panel > :not(.body) { flex-shrink: 0; }
svg.graph { width: 100%; height: 90px; display: block; cursor: pointer; background: #3a3733; flex-shrink: 0; }
.summary { display: grid; grid-template-columns: 1fr auto 1fr; gap: 5px 10px; padding: 10px 14px; align-items: center; font-variant-numeric: tabular-nums; }
.summary .h { color: var(--muted); font-size: 12px; text-align: center; }
.summary .l { text-align: right; } .summary .r { text-align: left; }
.summary .k { text-align: center; color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 6px; justify-content: center; }
.summary .big { font-size: 20px; font-weight: 700; }
.ico { display: inline-block; width: 18px; height: 18px; vertical-align: -4px; }
.ico.sm { width: 14px; height: 14px; vertical-align: -3px; }
.moments { padding: 8px 14px; display: flex; flex-direction: column; gap: 8px; }
.moment { background: var(--panel2); border-radius: 6px; padding: 8px 10px; cursor: pointer; border-left: 4px solid var(--line); }
.moment.blunder { border-left-color: var(--c-blunder); } .moment.mistake { border-left-color: var(--c-mistake); }
.moment.miss { border-left-color: var(--c-miss); } .moment.inaccuracy { border-left-color: var(--c-inaccuracy); }
.moment.current { outline: 2px solid var(--accent); }
.moment .mv { font-weight: 700; } .moment .hd { color: var(--muted); font-size: 12px; margin-left: 6px; }
.moment p { margin: 4px 0 0; }
.section { padding: 8px 14px 4px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.movelist { display: grid; grid-template-columns: 40px 1fr 1fr; font-variant-numeric: tabular-nums; }
.movelist .n { color: var(--muted); padding: 3px 8px; background: #2b2926; }
.movelist .m { padding: 3px 8px; cursor: pointer; display: flex; gap: 6px; align-items: center; }
.movelist .m:hover { background: var(--panel2); }
.movelist .m.cur { background: #4b4844; border-radius: 3px; }
.m.brilliant .san { color: var(--c-brilliant); font-weight: 700; } .m.great .san { color: var(--c-great); font-weight: 700; }
.m.best .san { color: var(--c-best); } .m.excellent .san { color: var(--c-excellent); }
.m.inaccuracy .san { color: var(--c-inaccuracy); } .m.mistake .san { color: var(--c-mistake); } .m.miss .san { color: var(--c-miss); }
.m.blunder .san { color: var(--c-blunder); font-weight: 700; } .m.book .san { color: var(--c-book); } .m.forced .san { color: var(--c-forced); }
.empty { padding: 30px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1><a href="#/">♞ Chess Review</a></h1>
  <span class="crumb" id="crumb"></span>
  <div class="right">
    <button id="b-sound" title="Toggle sound">🔊</button>
    <button id="b-refresh" title="Fetch new games from chess.com"><span class="i">⟳</span><span class="t"> Refresh games</span></button>
    <button id="b-all" title="Analyse every game that isn't analysed yet (hours)"><span class="i">⚙</span><span class="t"> Analyse all</span></button>
    <span id="jobstat" style="color:var(--muted);font-size:12px"></span>
    <a href="insights.html" title="Insights"><span class="i">📊</span><span class="t"> Insights →</span></a>
  </div>
</header>
<main>
  <section id="list">
    <div class="filters">
      <button data-f="result" data-v="" class="active">All</button>
      <button data-f="result" data-v="win">Wins</button>
      <button data-f="result" data-v="loss">Losses</button>
      <button data-f="result" data-v="draw">Draws</button>
      <span class="sep"></span>
      <button data-f="colour" data-v="" class="active">Both</button>
      <button data-f="colour" data-v="white">White</button>
      <button data-f="colour" data-v="black">Black</button>
      <span class="sep"></span>
      <button data-f="analysed" data-v="" class="active">Any</button>
      <button data-f="analysed" data-v="1">Analysed</button>
      <button data-f="analysed" data-v="0">Not yet</button>
      <span class="sep"></span>
      <button data-f="brilliant" data-v="" class="active">All moves</button>
      <button data-f="brilliant" data-v="mine">My brilliants</button>
      <button data-f="brilliant" data-v="any">Any brilliant</button>
      <span class="stat" id="liststat"></span>
    </div>
    <table class="games">
      <thead><tr><th>Date</th><th>Me</th><th>Opponent</th><th>Result</th><th>Opening</th><th>Accuracy</th><th>Analysis</th><th>Key</th><th>Blunders</th><th title="brilliant moves (mine)">!!</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>

  <section id="review" class="hidden">
    <div class="review">
      <div class="evalbar" id="evalbar"><div class="w"></div><div class="lbl top"></div><div class="lbl bot"></div></div>
      <div class="boardwrap">
        <div class="player" id="ptop"></div>
        <svg class="board" id="board" viewBox="0 0 100 100"></svg>
        <div class="player" id="pbot"></div>
      </div>
      <div class="panel">
        <div class="phead">
          <a href="#/" class="pbtn" title="Back to games (Esc)">←</a>
          <span class="ptitle"><svg class="ico"><use href="#ic-best"/></svg> Game Review</span>
          <span class="pright"><button class="pbtn" id="b-sound2" title="Sound">🔊</button><button class="pbtn" id="b-flip" title="Flip (f)">⇅</button></span>
        </div>
        <div class="ginfo" id="ginfo"></div>
        <div class="coach"><div class="avatar">♞</div><div class="bubble" id="now"></div></div>
        <div class="actions">
          <button id="b-explain" title="Show the full explanation">💡 Explain</button>
          <button id="b-best" title="Show the best move here; press again to play it">★ Best</button>
          <button id="b-nextm" title="Next move">→ Next</button>
        </div>
        <div class="body">
          <div class="movelist" id="movelist"></div>
          <div class="sections">
            <details open><summary>Summary</summary><div class="summary" id="summary"></div></details>
            <details open><summary>Key moments</summary><div class="moments" id="moments"></div></details>
            <details><summary>Opening</summary><div class="opening-info" id="opening"></div></details>
          </div>
        </div>
        <svg class="graph" id="graph"></svg>
        <div class="nav">
          <button id="b-first" title="Start (Home)">⏮</button>
          <button id="b-prev" title="Previous (←)">‹</button>
          <button id="b-play" title="Autoplay (p)">▶</button>
          <button id="b-next" title="Next (→)">›</button>
          <button id="b-last" title="End (End)">⏭</button>
        </div>
        <div class="pfoot">
          <button class="primary" id="b-analyse">Analyse game</button>
          <span id="astatus"></span>
          <button id="b-key" title="Next key moment (space)">Key ▸</button>
          <a href="insights.html" class="pbtn" title="Insights">📊</a>
        </div>
        <div class="progress hidden" id="aprog"><div style="width:0%"></div></div>
      </div>
    </div>
  </section>
</main>
<div id="toast" class="hidden"></div>

<svg width="0" height="0" style="position:absolute"><defs id="piecedefs"></defs>
<defs>
  <!-- chess.com-style classification icons: coloured disc + glyph, 20x20 units -->
  <symbol id="ic-brilliant" viewBox="-1.5 -1.5 23 23"><circle cx="10" cy="10" r="10" fill="#1baca6" stroke="#fff" stroke-width="1.6"/><text x="10" y="14.5" text-anchor="middle" font-size="12" font-weight="800" fill="#fff" font-family="Arial">!!</text></symbol>
  <symbol id="ic-great" viewBox="-1.5 -1.5 23 23"><circle cx="10" cy="10" r="10" fill="#5c8bb0" stroke="#fff" stroke-width="1.6"/><text x="10" y="14.5" text-anchor="middle" font-size="12" font-weight="800" fill="#fff" font-family="Arial">!</text></symbol>
  <symbol id="ic-best" viewBox="-1.5 -1.5 23 23"><circle cx="10" cy="10" r="10" fill="#81b64c" stroke="#fff" stroke-width="1.6"/><path d="M10 3.6l1.9 4 4.4.6-3.2 3.1.8 4.4L10 13.6l-3.9 2.1.8-4.4L3.7 8.2l4.4-.6z" fill="#fff"/></symbol>
  <symbol id="ic-excellent" viewBox="-1.5 -1.5 23 23"><circle cx="10" cy="10" r="10" fill="#96bc4b" stroke="#fff" stroke-width="1.6"/><path d="M5.5 10.5l3 3 6-6.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="ic-good" viewBox="-1.5 -1.5 23 23"><circle cx="10" cy="10" r="10" fill="#96af8b" stroke="#fff" stroke-width="1.6"/><path d="M5.5 10.5l3 3 6-6.5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="ic-book" viewBox="-1.5 -1.5 23 23"><circle cx="10" cy="10" r="10" fill="#a88865" stroke="#fff" stroke-width="1.6"/><path d="M5.5 5.5h3.5q1 0 1 1v8q0-1-1-1H5.5zM14.5 5.5H11q-1 0-1 1v8q0-1 1-1h3.5z" fill="#fff"/></symbol>
  <symbol id="ic-forced" viewBox="-1.5 -1.5 23 23"><circle cx="10" cy="10" r="10" fill="#97af8b" stroke="#fff" stroke-width="1.6"/><path d="M6 10h8M11 7l3 3-3 3" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="ic-inaccuracy" viewBox="-1.5 -1.5 23 23"><circle cx="10" cy="10" r="10" fill="#f7c631" stroke="#fff" stroke-width="1.6"/><text x="10" y="14.5" text-anchor="middle" font-size="11" font-weight="800" fill="#1b1b1b" font-family="Arial">?!</text></symbol>
  <symbol id="ic-mistake" viewBox="-1.5 -1.5 23 23"><circle cx="10" cy="10" r="10" fill="#ffa459" stroke="#fff" stroke-width="1.6"/><text x="10" y="14.5" text-anchor="middle" font-size="12" font-weight="800" fill="#1b1b1b" font-family="Arial">?</text></symbol>
  <symbol id="ic-miss" viewBox="-1.5 -1.5 23 23"><circle cx="10" cy="10" r="10" fill="#ff7769" stroke="#fff" stroke-width="1.6"/><path d="M6.5 6.5l7 7M13.5 6.5l-7 7" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></symbol>
  <symbol id="ic-blunder" viewBox="-1.5 -1.5 23 23"><circle cx="10" cy="10" r="10" fill="#fa412d" stroke="#fff" stroke-width="1.6"/><text x="10" y="14.5" text-anchor="middle" font-size="12" font-weight="800" fill="#fff" font-family="Arial">??</text></symbol>
</defs></svg>

<script>
const PIECES = /*__PIECES__*/;
const PIECE_ID = { p:'black-pawn', n:'black-knight', b:'black-bishop', r:'black-rook', q:'black-queen', k:'black-king',
                   P:'white-pawn', N:'white-knight', B:'white-bishop', R:'white-rook', Q:'white-queen', K:'white-king' };
document.getElementById('piecedefs').innerHTML = Object.values(PIECES).join('');

const LABEL_NAME = { brilliant:'Brilliant', great:'Great', best:'Best', excellent:'Excellent', good:'Good', book:'Book', forced:'Forced',
                     inaccuracy:'Inaccuracy', mistake:'Mistake', miss:'Miss', blunder:'Blunder' };
const LABEL_ORDER = ['brilliant','great','best','excellent','good','book','forced','inaccuracy','mistake','miss','blunder'];
const COLOR = { brilliant:'#1baca6', great:'#5c8bb0', best:'#81b64c', excellent:'#96bc4b', good:'#96af8b', book:'#a88865', forced:'#97af8b',
                inaccuracy:'#f7c631', mistake:'#ffa459', miss:'#ff7769', blunder:'#fa412d' };
const BAD = new Set(['inaccuracy', 'mistake', 'miss', 'blunder']);
const icon = (lb, cls = 'ico') => lb && LABEL_NAME[lb] ? `<svg class="${cls}"><use href="#ic-${lb}"/></svg>` : '';

const $ = id => document.getElementById(id);
const state = { games: null, username: '', filters: { result:'', colour:'', analysed:'', brilliant:'' }, game: null, ply: 0, flipped: false, tab: 'review',
                sound: true, poll: null,
                variation: null,      // { basePly, moves: [...] } - a "what if" line branching after basePly main-line moves
                sel: null, legal: null, exploring: false, cycle: {}, playing: null, explain: false, showBest: false };
try { state.sound = localStorage.getItem('sound') !== 'off'; } catch (e) {}

// The line being viewed: main-line moves up to the branch point, then the variation.
function line() {
  const g = state.game;
  if (!state.variation) return g.moves;
  return g.moves.slice(0, state.variation.basePly).concat(state.variation.moves);
}
const inVariation = () => !!state.variation && state.ply > state.variation.basePly;
function dropVariation() { state.variation = null; }

// ---------- sounds (chess.com default set in sounds/, fetched by scripts/fetch_sounds.sh) ----------
// chess.com's review stingers aren't publicly served: brilliant plays only if brilliant.mp3/.webm exists.
const SOUND_FILES = {
  start: ['game-start'], end: ['game-end'], capture: ['capture'], castle: ['castle'], self: ['move-self'],
  opp: ['move-opponent'], check: ['move-check'], promote: ['promote'], tenseconds: ['tenseconds'], notify: ['notify'],
  illegal: ['illegal'], brilliant: ['brilliant', 'brilliant.webm'],
};
const audioCache = {};
function audioFor(name) {
  if (name in audioCache) return audioCache[name];
  const cands = SOUND_FILES[name] || [];
  const src = c => `sounds/${c}${c.includes('.') ? '' : '.mp3'}`;
  const a = new Audio(src(cands[0]));
  a.preload = 'auto';
  a.addEventListener('error', () => {
    if (cands[1]) { const b = new Audio(src(cands[1])); b.addEventListener('error', () => { audioCache[name] = null; }, { once: true }); audioCache[name] = b; }
    else audioCache[name] = null;   // missing file: stay silent
  }, { once: true });
  audioCache[name] = a;
  return a;
}
function play(name, delay = 0) {
  if (!state.sound) return;
  const go = () => { try { const src = audioFor(name); if (!src) return; const a = src.cloneNode(); a.volume = 0.9; a.play().catch(() => {}); } catch (e) {} };
  delay ? setTimeout(go, delay) : go();
}
Object.keys(SOUND_FILES).forEach(audioFor);

let tenSecondsPlayedFor = null;
function playMoveSound(m, isLast) {
  if (!m) return;
  const san = m.san;
  if (san.includes('#')) { play('check'); play('end', 220); }
  else if (san.includes('+')) play('check');
  else if (san.startsWith('O-O')) play('castle');
  else if (san.includes('=')) play('promote');
  else if (san.includes('x')) play('capture');
  else play(m.is_mine ? 'self' : 'opp');
  if (isLast && !san.includes('#') && !inVariation()) play('end', 250);
  if (m.label === 'brilliant') play('brilliant', 180);
  if (m.clock != null && m.clock < 10 && m.is_mine && tenSecondsPlayedFor !== state.game.id) { tenSecondsPlayedFor = state.game.id; play('tenseconds', 120); }
}
$('b-sound').onclick = () => { state.sound = !state.sound; $('b-sound').textContent = state.sound ? '🔊' : '🔇';
$('b-sound2').onclick = () => { $('b-sound').onclick(); $('b-sound2').textContent = $('b-sound').textContent; };
$('b-sound2').textContent = $('b-sound').textContent; try { localStorage.setItem('sound', state.sound ? 'on' : 'off'); } catch (e) {} };
$('b-sound').textContent = state.sound ? '🔊' : '🔇';

// ---------- routing ----------
window.addEventListener('hashchange', route);
async function route() {
  const h = location.hash || '#/';
  const m = h.match(/^#\/game\/([^/?]+)/);
  if (m) await showGame(m[1]); else await showList();
}
async function loadGames(force) {
  if (!state.games || force) { const d = await (await fetch('games.json')).json(); state.games = d.games; state.username = d.username; }
  return state.games;
}

// ---------- list ----------
async function showList() {
  $('review').classList.add('hidden'); $('list').classList.remove('hidden');
  state.game = null; dropVariation(); stopPolling(); stopPlay();
  const games = await loadGames(true);
  $('crumb').textContent = state.username || '';
  const f = state.filters;
  const rows = games.filter(g => (!f.result || g.result === f.result) && (!f.colour || g.my_colour === f.colour) &&
    (f.analysed === '' || (f.analysed === '1' ? g.analysed >= 0.999 : g.analysed < 0.999)) &&
    (f.brilliant === '' || (f.brilliant === 'mine' ? g.brilliants > 0 : g.brilliants_any > 0)));
  $('liststat').textContent = `${rows.length} of ${games.length} games`;
  $('rows').innerHTML = rows.map(g => `
    <tr class="row" data-id="${g.id}">
      <td>${fmtDate(g.played_at)}<div style="color:var(--muted);font-size:12px">${g.time_class} ${g.time_control || ''}</div></td>
      <td><span class="dot ${g.my_colour}"></span>${g.my_rating ?? ''}</td>
      <td>${esc(g.opponent || '?')} <span style="color:var(--muted)">(${g.opponent_rating ?? '?'})</span></td>
      <td><span class="res ${g.result}">${g.result === 'win' ? 'W' : g.result === 'loss' ? 'L' : '½'}</span></td>
      <td class="opening" title="${esc(g.opening_name || '')}">${g.eco || ''} ${esc(g.opening_name || '')}</td>
      <td class="acc">${g.analysed >= 0.999 ? `${fmtAcc(g.my_accuracy)} <span style="color:var(--muted)">vs ${fmtAcc(g.opp_accuracy)}</span>` : '<span style="color:var(--muted)">–</span>'}</td>
      <td>${analysedPill(g.analysed)}</td>
      <td class="num">${g.analysed >= 0.999 ? (g.n_key || '0') : ''}</td>
      <td class="num ${g.blunders ? 'blunders' : ''}">${g.analysed >= 0.999 ? (g.blunders || '0') : ''}</td>
      <td class="num">${g.brilliants ? `<span style="color:var(--c-brilliant);font-weight:700">${g.brilliants}</span>` : ''}</td>
    </tr>`).join('');
  $('rows').querySelectorAll('tr.row').forEach(tr => tr.onclick = () => location.hash = '#/game/' + tr.dataset.id);
}
function analysedPill(a) {
  if (a >= 0.999) return '<span class="pill full">analysed</span>';
  if (a > 0) return `<span class="pill part">${Math.round(a * 100)}%</span>`;
  return '<span class="pill">not analysed</span>';
}
document.querySelectorAll('.filters button').forEach(b => b.onclick = () => {
  state.filters[b.dataset.f] = b.dataset.v;
  document.querySelectorAll(`.filters button[data-f="${b.dataset.f}"]`).forEach(x => x.classList.toggle('active', x === b));
  showList();
});

// ---------- review ----------
async function loadGame(id) { return (await fetch(`games/${id}.json`)).json(); }
async function showGame(id) {
  const g = await loadGame(id);
  const same = state.game && state.game.id === id;
  state.game = g;
  if (!same) { stopPlay(); state.ply = 0; state.flipped = g.my_colour === 'black'; dropVariation(); state.sel = null; state.cycle = {}; }
  $('list').classList.add('hidden'); $('review').classList.remove('hidden');
  $('crumb').textContent = `${g.white.name} vs ${g.black.name}`;
  $('ginfo').innerHTML = `${fmtDate(g.played_at)} · ${g.time_class} ${g.time_control || ''} · ${esc(g.termination || '')}` +
    (g.url.startsWith('http') ? ` · <a href="${g.url}" target="_blank" style="color:var(--accent)">chess.com ↗</a>` : '');
  renderSummary(); renderMoments(); renderMoveList(); renderGraph(); renderAnalyseBox(); renderOpening();
  update(false);
  if (!same) play('start');
  pollStatus();
}
async function reloadGame() {
  if (!state.game) return;
  const g = await loadGame(state.game.id);
  if (g.analysed === state.game.analysed && g.key_moments.length === state.game.key_moments.length) return;
  const body = document.querySelector('.panel .body'), scrollTop = body.scrollTop;
  state.game = g;
  renderSummary(); renderMoments(); patchMoveList(); renderGraph(); renderAnalyseBox();
  renderBoard(); renderPlayers(); renderEvalBar(); renderNow();
  body.scrollTop = scrollTop;
}

function update(sound = true) {
  renderBoard(); renderPlayers(); renderEvalBar(); renderNow(); highlightCurrent(); renderNav();
  if (!sound) return;
  const ln = line();
  if (state.ply > 0) playMoveSound(ln[state.ply - 1], state.ply === ln.length);
  else play('start');
}
function renderNav() {
  const n = line().length;
  $('b-first').disabled = $('b-prev').disabled = state.ply === 0;
  $('b-next').disabled = $('b-last').disabled = state.ply >= n;
  $('b-key').disabled = !state.game.key_moments.length;
  $('b-play').disabled = n === 0;
  $('b-play').textContent = state.playing ? '❚❚' : '▶';
  $('b-play').classList.toggle('playing', !!state.playing);
}
// Autoplay: one move every 1.5 s; stepping manually keeps it running, the end (or a click to pause) stops it.
const PLAY_MS = 1500;
function togglePlay() {
  if (state.playing) return stopPlay();
  if (state.ply >= line().length) go(0);
  state.playing = setInterval(() => {
    if (!state.game || state.exploring) return;
    if (state.ply >= line().length) return stopPlay();
    go(state.ply + 1);
  }, PLAY_MS);
  renderNav();
}
function stopPlay() { if (state.playing) clearInterval(state.playing); state.playing = null; if (state.game) renderNav(); }

// ---------- analyse / refresh ----------
function renderAnalyseBox(job) {
  const g = state.game;
  const btn = $('b-analyse'), st = $('astatus'), prog = $('aprog');
  const active = job && ['queued', 'running', 'finishing'].includes(job.status);
  if (active) {
    btn.disabled = true; btn.classList.add('primary');
    btn.textContent = job.status === 'finishing' ? 'Finishing…' : 'Analysing…';
    const pct = job.total ? Math.round(100 * job.done / job.total) : 0;
    st.textContent = job.total ? `${job.done}/${job.total} positions · ${pct}% · ${Math.round(job.elapsed)}s` : 'starting engines…';
    prog.classList.remove('hidden');
    prog.firstElementChild.style.width = pct + '%';
    return;
  }
  prog.classList.add('hidden');
  if (g.analysed >= 0.999) { btn.textContent = 'Analysed ✓'; btn.disabled = true; btn.classList.remove('primary'); st.textContent = `${g.moves.length} moves · MultiPV 3`; }
  else { btn.textContent = g.analysed > 0 ? 'Continue analysis' : 'Analyse game'; btn.disabled = false; btn.classList.add('primary'); st.textContent = g.analysed > 0 ? `${Math.round(g.analysed * 100)}% analysed` : 'Not analysed yet'; }
}
$('b-analyse').onclick = async () => {
  const r = await fetch(`api/analyse/${state.game.id}`, { method: 'POST' });
  const d = await r.json();
  if (!r.ok) { toast(d.error === 'busy' ? `Busy: ${jobText(d.job)}` : d.error); return; }
  lastJobDone = -1;
  renderAnalyseBox(d.job);
  pollStatus();
};
$('b-refresh').onclick = async () => {
  const r = await fetch('api/refresh', { method: 'POST' });
  const d = await r.json();
  if (!r.ok) { toast(d.error === 'busy' ? `Busy: ${jobText(d.job)}` : d.error); return; }
  toast('Fetching new games from chess.com…');
  pollStatus();
};
$('b-all').onclick = async () => {
  if (!confirm('Analyse every game that is not fully analysed yet? This takes a few hours and uses all CPU cores.')) return;
  const r = await fetch('api/analyse_all', { method: 'POST' });
  const d = await r.json();
  if (!r.ok) { toast(d.error === 'busy' ? `Busy: ${jobText(d.job)}` : d.error); return; }
  toast('Analysing all games…');
  pollStatus();
};
function jobText(j) {
  if (j.kind === 'analyse_all') return `analysing all games: ${j.done}/${j.total} done, current ${j.game} ${j.game_done}/${j.game_total}`;
  return j.kind === 'analyse' ? `analysing game ${j.game} (${j.done}/${j.total})` : `refreshing games (${j.done}/${j.total})`;
}
let lastJobStatus = null, lastJobDone = -1;
async function pollStatus() {
  stopPolling();
  const tick = async () => {
    let d;
    try { d = await (await fetch('api/status')).json(); } catch (e) { return; }
    const j = d.job;
    const active = j && ['queued', 'running', 'finishing'].includes(j.status);
    $('b-refresh').disabled = !!active; $('b-all').disabled = !!active;
    $('jobstat').textContent = active ? jobText(j) : '';
    if (j && j.kind === 'analyse_all') {
      if (active && state.game && j.game === state.game.id && j.game_done !== lastJobDone) { lastJobDone = j.game_done; await reloadGame(); }
      if (active && !state.game && j.done !== lastJobDone) { lastJobDone = j.done; showList(); }
      if (!active && lastJobStatus && lastJobStatus !== j.status) { toast(j.status === 'done' ? 'All games analysed' : `Batch ${j.status}` + (j.error ? ': ' + j.error : '')); if (state.game) reloadGame(); else showList(); }
    }
    if (j && j.kind === 'analyse' && state.game && j.game === state.game.id) {
      renderAnalyseBox(active ? j : null);
      if (active) {
        if (j.done !== lastJobDone) { lastJobDone = j.done; await reloadGame(); renderAnalyseBox(j); }
      } else if (lastJobStatus && lastJobStatus !== j.status) {
        await reloadGame(); renderAnalyseBox(null);
        if (j.status === 'error') toast('Analysis failed: ' + j.error); else play('notify');
      }
    } else if (j && j.kind === 'refresh' && lastJobStatus && lastJobStatus !== j.status && !active) {
      toast(j.status === 'done' ? 'Games refreshed' : 'Refresh failed: ' + j.error);
      if (!state.game) showList(); else reloadGame();
    }
    lastJobStatus = j ? j.status : null;
    if (active) state.poll = setTimeout(tick, 700);
  };
  tick();
}
function stopPolling() { if (state.poll) clearTimeout(state.poll); state.poll = null; }
let toastT = null;
function toast(msg) { $('toast').textContent = msg; $('toast').classList.remove('hidden'); clearTimeout(toastT); toastT = setTimeout(() => $('toast').classList.add('hidden'), 3500); }

// ---------- board ----------
function parseFen(fen) {
  const board = {};
  fen.split(' ')[0].split('/').forEach((row, r) => {
    let f = 0;
    for (const ch of row) { if (/\d/.test(ch)) f += +ch; else { board[sqName(f, 7 - r)] = ch; f++; } }
  });
  return board;
}
const sqName = (f, r) => 'abcdefgh'[f] + (r + 1);
function sqXY(name) {
  let f = 'abcdefgh'.indexOf(name[0]), r = +name[1] - 1;
  if (state.flipped) { f = 7 - f; r = 7 - r; }
  return [f * 12.5, (7 - r) * 12.5];
}
function currentFen() { const ln = line(); return state.ply === 0 ? state.game.start_fen : ln[state.ply - 1].fen; }
function currentMove() { return state.ply > 0 ? line()[state.ply - 1] : null; }
const tf = (x, y) => `translate(${x}px, ${y}px) scale(${12.5 / 45})`;
let lastPly = null, lastGameId = null, lastFlipped = null, lastFen = null;
// Squares whose piece should glide in from another square when stepping one ply forward or back.
function animPairs() {
  const g = state.game, ln = line();
  if (lastGameId !== g.id || lastFlipped !== state.flipped || lastPly === null || Math.abs(state.ply - lastPly) !== 1) return [];
  const forward = state.ply > lastPly;
  const m = ln[forward ? state.ply - 1 : state.ply];
  if (!m) return [];
  const from = m.uci.slice(0, 2), to = m.uci.slice(2, 4);
  const pairs = [forward ? [from, to] : [to, from]];
  if (m.san.startsWith('O-O')) {
    const rank = from[1], long = m.san.startsWith('O-O-O');
    const rf = (long ? 'a' : 'h') + rank, rt = (long ? 'd' : 'f') + rank;
    pairs.push(forward ? [rf, rt] : [rt, rf]);
  }
  return pairs;
}

function renderBoard() {
  const g = state.game, svg = $('board');
  const fen = currentFen(), pieces = parseFen(fen);
  const turn = fen.split(' ')[1] === 'w' ? 'white' : 'black';
  const mv = currentMove();
  const targets = new Set(state.sel && state.legal ? state.legal.filter(u => u.startsWith(state.sel)).map(u => u.slice(2, 4)) : []);
  let out = '';
  for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) {
    const name = sqName(f, r), [x, y] = sqXY(name);
    const light = (f + r) % 2 === 1;
    out += `<rect class="sq ${light ? 'light' : 'dark'}" x="${x}" y="${y}" width="12.5" height="12.5"/>`;
    if (mv && (name === mv.uci.slice(0, 2) || name === mv.uci.slice(2, 4)))
      out += `<rect class="sq last" x="${x}" y="${y}" width="12.5" height="12.5"/>`;
    if (mv && BAD.has(mv.label) && mv.hung && mv.hung.includes(name))
      out += `<rect x="${x}" y="${y}" width="12.5" height="12.5" fill="rgba(250,65,45,.4)"/>`;
    if (state.sel === name) out += `<rect class="sq sel" x="${x}" y="${y}" width="12.5" height="12.5"/>`;
  }
  for (let i = 0; i < 8; i++) {
    const file = state.flipped ? 7 - i : i, rank = state.flipped ? i : 7 - i;
    const bottomLight = (file + (state.flipped ? 7 : 0)) % 2 === 1;
    const leftLight = ((state.flipped ? 7 : 0) + rank) % 2 === 1;
    out += `<text class="coord ${bottomLight ? 'onlight' : 'ondark'}" x="${i * 12.5 + 11.6}" y="99.1" text-anchor="middle">${'abcdefgh'[file]}</text>`;
    out += `<text class="coord ${leftLight ? 'onlight' : 'ondark'}" x="0.7" y="${i * 12.5 + 3.1}">${rank + 1}</text>`;
  }
  for (const [name, ch] of Object.entries(pieces)) {
    const [x, y] = sqXY(name);
    const own = (ch === ch.toUpperCase()) === (turn === 'white');
    out += `<use class="piece ${own ? 'own' : ''}" data-sq="${name}" href="#${PIECE_ID[ch]}" style="transform:${tf(x, y)}"/>`;
  }
  for (const t of targets) {
    const [x, y] = sqXY(t);
    out += pieces[t] ? `<circle class="target ring" cx="${x + 6.25}" cy="${y + 6.25}" r="5.5"/>`
                     : `<circle class="target" cx="${x + 6.25}" cy="${y + 6.25}" r="2"/>`;
  }
  out += `<defs>${['#fa412d', '#81b64c', '#4a90d9'].map((c, i) => `<marker id="ah${i}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${c}"/></marker>`).join('')}</defs>`;
  if (state.showBest && bestMoveHere()) out += arrow(bestMoveHere(), '#81b64c', 1);
  if (mv) {
    if (BAD.has(mv.label) && mv.best_uci && mv.best_uci !== mv.uci) {
      out += arrow(mv.uci, '#fa412d', 0);
      out += arrow(mv.best_uci, '#81b64c', 1);
    }
    if (mv.label && LABEL_NAME[mv.label]) {
      const [x, y] = sqXY(mv.uci.slice(2, 4));
      out += `<use class="badge" href="#ic-${mv.label}" x="${x + 8.1}" y="${y - 1.9}" width="6.2" height="6.2"/>`;
    }
  }
  svg.innerHTML = out;
  svg.classList.toggle('playable', !state.exploring);
  for (const [from, to] of animPairs()) {
    const el = svg.querySelector(`use[data-sq="${to}"]`);
    if (!el) continue;
    svg.appendChild(el);
    el.style.transition = 'none';

    go(9); say(`back before branch: variation=${state.variation}, ply ${state.ply}, varrow=${!!document.querySelector('.varrow')}`);
    go(10); go(11); say(`forward again on main line: ply ${state.ply}, san=${currentMove().san} (main line: ${state.game.moves[10].san})`);
    cycleLabel('white', 'best'); const a = state.ply; cycleLabel('white', 'best'); say(`cycle best white: ${a} -> ${state.ply}`);
    say('DONE');
  } catch (e) { say('ERROR ' + e.stack); }
})();
</script>
