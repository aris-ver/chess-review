# Builds the Windows desktop zip on a clean Windows runner. On a version tag (v0.1.0, ...) it is
# attached to that tag's GitHub Release; the README's download link points at the latest release.
# Run manually (Actions -> Windows release -> Run workflow) to get the zip as a workflow artifact
# without publishing a release.
name: Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the app
        env:
          GH_TOKEN: ${{ github.token }}
        run: powershell -ExecutionPolicy Bypass -File packaging\build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: chess-review-windows
          path: packaging/dist/chess-review-windows.zip
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" packaging/dist/chess-review-windows.zip --clobber
