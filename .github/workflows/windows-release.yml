# Builds the Windows desktop zips on a clean Windows runner. On a version tag (v0.1.0, ...) they are attached
# to that tag's GitHub Release: chess-review-windows.zip (the whole app; the README's download link points at
# the latest release) and chess-review-update-<runtime>.zip (what installed copies fetch through the in-app
# updater, see chess_review/updater.py). Run manually (Actions -> Windows release -> Run workflow) to get the
# zips as a workflow artifact without publishing a release.
name: Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # so a manual run can name its build after the nearest tag (git describe)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the app
        env:
          GH_TOKEN: ${{ github.token }}
          # on a tag push the version is the tag; a manual run gets git describe's v0.1.4-3-gabc123
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: powershell -ExecutionPolicy Bypass -File packaging\build_windows.ps1 -Version "$env:VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: chess-review-windows
          path: packaging/dist/chess-review-*.zip
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        # The notes are the commit subjects since the previous tag: the app shows them under "What's new"
        # when it offers the update, so keep commit subjects readable to a user.
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
            {
              printf "## What's new\n\n"
              git log --no-merges --pretty='* %s' ${prev:+$prev..}"$GITHUB_REF_NAME"
              if [ -n "$prev" ]; then printf '\n**Full changelog**: https://github.com/%s/compare/%s...%s\n' "$GITHUB_REPOSITORY" "$prev" "$GITHUB_REF_NAME"; fi
            } > notes.md
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" packaging/dist/chess-review-*.zip --clobber
